<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; width: 380px; max-height: 480px; overflow-y: auto;
    background: #111317; color: #e6e8eb;
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { padding: 11px 13px; border-bottom: 1px solid #23262c; display: flex; align-items: baseline; gap: 8px; }
  header b { font-size: 13px; }
  header span { font-size: 11px; color: #7d848e; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 10px 13px; border-bottom: 1px solid #1b1e23; }
  .row { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
  .kind {
    flex: 0 0 auto; font-size: 10px; padding: 1px 6px; border-radius: 4px;
    background: #1f2937; color: #93b4f5; letter-spacing: .04em;
  }
  .kind.hls { background: #1e3a2f; color: #86e0ab; }
  .kind.dash { background: #3a2f1e; color: #e0c386; }
  .url {
    font-size: 11px; color: #aeb4bd; word-break: break-all;
    font-family: ui-monospace, Consolas, monospace;
  }
  .acts { display: flex; gap: 6px; margin-top: 6px; }
  button {
    border: 1px solid #2b3038; background: #191c21; color: #ccd1d8;
    border-radius: 6px; padding: 4px 9px; font-size: 11px; cursor: pointer;
  }
  button:hover { background: #22262c; }
  button.ok { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  #empty { padding: 28px 16px; text-align: center; color: #6b7280; font-size: 12px; line-height: 1.7; }
  footer { padding: 9px 13px; border-top: 1px solid #23262c; font-size: 11px; color: #6b7280; }
</style>
</head>
<body>
<header><b>ReVid</b><span id="count"></span></header>
<ul id="list"></ul>
<div id="empty" hidden>這個分頁還沒載入任何影片串流。<br>播放影片之後再打開這裡。</div>
<footer id="foot"></footer>
<script src="popup.js"></script>
</body>
</html>
