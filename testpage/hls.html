<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HLS page</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #14161a; color: #cfd3da; padding: 24px; font-family: system-ui, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 17px; margin-bottom: 12px; }
  video { width: 100%; display: block; background: #000; }
  p { margin-top: 14px; font-size: 13px; opacity: .7; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>A page that streams</h1>
  <!-- The src is never an attribute: hls.js feeds the element through MSE, so
       the only place the playlist URL exists is inside a network request.
       That is the whole point of the capture — the DOM does not have it. -->
  <video id="v" controls muted playsinline></video>
  <p id="state">starting…</p>
</div>
<script src="hls.min.js"></script>
<script>
  const v = document.getElementById('v');
  const state = document.getElementById('state');
  const SRC = 'hls/index.m3u8';
  if (window.Hls && Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(SRC);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      state.textContent = 'manifest parsed; playing';
      v.play().catch((e) => { state.textContent = 'autoplay blocked: ' + e.name; });
    });
    hls.on(Hls.Events.ERROR, (_e, d) => { if (d.fatal) state.textContent = 'hls error: ' + d.details; });
  } else {
    v.src = SRC;
    state.textContent = 'native hls';
    v.play().catch(() => {});
  }
</script>
</body>
</html>
