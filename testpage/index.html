<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overlay test page</title>
<style>
  /* Deliberately hostile: a page that resets everything and paints over the
     video area is exactly what the overlay has to survive on real sites. */
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Georgia, serif !important; }
  body { background: #14161a; color: #cfd3da; padding: 24px; }
  h1 { font-size: 18px; margin-bottom: 12px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .frame { position: relative; background: #000; }
  video { width: 100%; display: block; }
  p.note { margin-top: 14px; font-size: 13px; opacity: .7; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Somebody else's page</h1>
  <div class="frame">
    <!-- A caption track the page itself never shows: the overlay has to put
         the track into 'hidden' mode to read it without the browser also
         drawing its own captions. -->
    <video id="player" controls preload="auto" crossorigin="anonymous">
      <source src="clip.mp4" type="video/mp4">
      <track id="cc" kind="subtitles" srclang="en" label="English" src="subs.vtt" default>
    </video>
  </div>
  <p class="note">
    Cue 2 is one 200-character cue, the shape a transcriber produces for a run
    of dialogue. Rendered whole it is a slab across the middle of the picture.
  </p>
</div>
</body>
</html>
